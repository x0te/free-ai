name: deploy

# 한 번의 빌드로 두 주소에 배포
#   x0te.github.io/free-ai/  ← 이 저장소의 GitHub Pages (BASE_PATH=/free-ai)
#   free-ai.today            ← x0te/free-ai-today 의 gh-pages 브랜치 (BASE_PATH='', 배포 키로 푸시)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 매일 00:10 KST 재빌드 (NEW 배지·이벤트 만료·화제성 반영)
    - cron: '10 15 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: 누락된 로고 가져오기
        run: node scripts/fetch-logos.mjs
        continue-on-error: true
      - name: 화제성 갱신 (커뮤니티 언급량, 실패 시 저장된 값 사용)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/hot.mjs
        continue-on-error: true

      - name: 빌드 — x0te.github.io/free-ai
        run: node scripts/build.mjs
        env:
          BASE_PATH: /free-ai
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: 빌드 — free-ai.today
        run: node scripts/build.mjs
        env:
          BASE_PATH: ''
      - name: free-ai.today 저장소로 배포
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.FREE_AI_TODAY_DEPLOY_KEY }}
          external_repository: x0te/free-ai-today
          publish_branch: gh-pages
          publish_dir: ./dist
          cname: free-ai.today
          force_orphan: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          full_commit_message: 'deploy: x0te/free-ai@${{ github.sha }}'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
